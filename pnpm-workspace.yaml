# pnpm 11 workspace config (generated during the 0.1.2-alpha.3 dependency
# upgrade). pnpm 11 ignores build scripts by default; these two ship the
# native/genai bindings the toolchain needs. `minimumReleaseAgeExclude` lets a
# fresh `pnpm install` accept the just-published alpha prereleases without the
# release-age gate refusing them.
allowBuilds:
  '@google/genai': true
  protobufjs: true
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-atomic-write@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-attachment@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-authorization@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-brand@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-client-locale@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-client-ui-renderer@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-client-ui-settings-plugins@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-client-ui-slots@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-credentials@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-fs@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-home-paths@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-host-webserver@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-invariants@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-launch-environment@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-llm-pi-ai@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-llm@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-sandbox@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-scope@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-session@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-settings@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-timeout@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-typert-protocol@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-util-crypto@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-util-values@0.1.2-alpha.3'
